name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      - run: uvx ruff@0.17.0 check src tests
      - name: Tests (no network access needed)
        run: uv run pytest -v
      - name: The committed report reproduces from the committed data
        run: |
          uv run calatlas report
          git diff --exit-code -I '^Generated ' -- reports/REPORT.md reports/HOLDOUT.md docs/data
