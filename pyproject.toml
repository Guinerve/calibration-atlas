[project]
name = "calibration-atlas"
version = "1.1.0"
description = "A calibration study of 11,881 resolved Polymarket markets that you can reproduce, with a holdout test fixed in advance."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]

[project.scripts]
calatlas = "calibration_atlas.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibration_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/Guinerve/calibration-atlas"
Explorer = "https://guinerve.github.io/calibration-atlas/"
Report = "https://github.com/Guinerve/calibration-atlas/blob/main/reports/REPORT.md"
Protocol = "https://github.com/Guinerve/calibration-atlas/blob/main/PROTOCOL.md"
